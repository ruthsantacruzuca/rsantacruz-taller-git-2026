spring.application.name=minecraft

# Base H2 en archivo: el estado sobrevive a reinicios del servicio.
spring.datasource.url=jdbc:h2:file:./data/minecraft;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza el esquema a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
