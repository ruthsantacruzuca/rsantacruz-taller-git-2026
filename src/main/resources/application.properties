spring.application.name=minecraft

# Base H2 en archivo: el estado sobrevive a reinicios del servicio.
spring.datasource.url=jdbc:h2:file:./data/minecraft;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza el esquema a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI: documento JSON y UI de Swagger.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# APIs consultadas por el escenario POO-09 (A2 = Matias, A3 = Sebastian).
companeros.a2.base-url=${A2_BASE_URL:http://localhost:8081}
companeros.a3.base-url=${A3_BASE_URL:http://localhost:8082}
